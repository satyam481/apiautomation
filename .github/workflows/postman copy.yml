name: API Automation

on:
  push:
    branches:
      - sm-dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: '40 17 * * *'   # Nightly regression (14:00 UTC)

permissions:
  contents: write

jobs:

  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman + HTML Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      # ----------------------------
      # Run Smoke or Regression
      # ----------------------------
      - name: Run API Tests
        run: |
          mkdir -p newman-reports

          COLLECTION_URL="https://api.getpostman.com/collections/45236363-e707068e-ba6a-49f6-8050-0e03bb9a1e42?apikey=${{ secrets.POSTMAN_API_KEY }}"

          # ----------------------------
          # 🔹 Environment File Support (Currently Disabled)
          # ----------------------------
          # ENV_FILE="./environment.postman_environment.json"
          #
          # If using GitHub Secret instead:
          # echo "${{ secrets.POSTMAN_ENV }}" > env.json
          # ENV_FILE="env.json"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "Running Full Regression"
            newman run "$COLLECTION_URL" \
              # -e "$ENV_FILE" \
              --reporters cli,htmlextra \
              --reporter-htmlextra-export newman-reports/index.html \
              --delay-request 200
          else
            echo "Running Smoke Suite"
            newman run "$COLLECTION_URL" \
              --folder "Smoke" \
              # -e "$ENV_FILE" \
              --reporters cli,htmlextra \
              --reporter-htmlextra-export newman-reports/index.html \
              --delay-request 200
          fi

      # ----------------------------
      # Checkout gh-pages branch
      # ----------------------------
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      # ----------------------------
      # Publish Report to GitHub Pages
      # ----------------------------
      - name: Publish to GitHub Pages
        run: |
          mkdir -p gh-pages
          rm -rf gh-pages/*
          cp -r newman-reports/* gh-pages/

          cd gh-pages
          git init
          git checkout -B gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Update Newman HTML Report"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages